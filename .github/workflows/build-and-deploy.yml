name: Build, Push & Notify

on:
  push:
    branches: [master, Migration]
  workflow_dispatch:
    inputs:
      configs:
        description: 'Configs to build (comma-separated: normal,premium)'
        required: false
        default: ''
        type: string

# Enabled configs. On push, only these are built.
env:
  REGISTRY: registry.kayotech.nl
  ENABLED_CONFIGS: normal,premium

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - name: Build matrix
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.configs }}" ]; then
            CONFIGS="${{ github.event.inputs.configs }}"
          else
            CONFIGS="${{ env.ENABLED_CONFIGS }}"
          fi

          ITEMS="["
          FIRST=true
          for cfg in $(echo "$CONFIGS" | tr ',' ' '); do
            case "$cfg" in
              normal)  DOTNET_CFG="Release"; TAG_SUFFIX="normal" ;;
              premium) DOTNET_CFG="Premium"; TAG_SUFFIX="premium" ;;
              *) continue ;;
            esac
            [ "$FIRST" = true ] && FIRST=false || ITEMS="$ITEMS,"
            ITEMS="$ITEMS{\"config\":\"$DOTNET_CFG\",\"tag\":\"enforcer-$TAG_SUFFIX\"}"
          done
          ITEMS="$ITEMS]"

          echo "result=$ITEMS" >> $GITHUB_OUTPUT

  build:
    needs: resolve
    if: needs.resolve.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-buildx-action@v4.1.0
      - uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: Dockerfile
          build-args: CONFIG=${{ matrix.config }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.tag }}:latest
            ${{ env.REGISTRY }}/${{ matrix.tag }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

  notify:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          MSG="Enforcer build ${SHORT_SHA} pushed to registry%0A%0ABranch: ${GITHUB_REF_NAME}%0A%0AUse /upgradeenforcer <config> to apply."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.NOTIFY_CHAT_ID }}" \
            -d "text=${MSG}"
